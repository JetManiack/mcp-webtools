<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>go-ai-webtools</title>
  <style>
    /* Vendored at build time (see Makefile's vendor-frontend-fonts target)
       and served from our own origin — no per-visitor request to a
       third-party font CDN, and the app still renders (with fallback
       fonts) if this origin is the only one reachable. */
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 500 700;
      font-display: swap;
      src: url("/fonts/space-grotesk.woff2") format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Sans";
      font-weight: 400 600;
      font-display: swap;
      src: url("/fonts/ibm-plex-sans.woff2") format("woff2");
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-weight: 400 500;
      font-display: swap;
      src: url("/fonts/jetbrains-mono.woff2") format("woff2");
    }
    :root {
      --bg: #0b0f1a;
      --surface: #131a2b;
      --border: #232b40;
      --text: #e7eaf2;
      --text-dim: #8891a8;
      --signal: #ffb454;
      --credential: #5cc8ff;
      --revoked: #4a5268;
      --ok: #6bd68a;
      --fail: #f2a6a6;
      --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 var(--font-body);
    }
    header.site {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.9rem 1.4rem;
      background: #0d1220ee;
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    header.site h1 {
      margin: 0;
      font: 600 17px/1 var(--font-display);
      letter-spacing: 0.01em;
      color: #fff;
    }
    header.site .spacer { flex: 1; }
    header.site .count {
      font: 500 12px/1 var(--font-mono);
      color: var(--text-dim);
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    h2.section-title {
      font: 600 20px/1.2 var(--font-display);
      margin: 0 0 1rem;
      color: #fff;
    }
    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      font: 500 13px/1 var(--font-body);
      cursor: pointer;
    }
    button:hover { border-color: var(--credential); }
    button.primary {
      background: var(--signal);
      color: #201404;
      border-color: var(--signal);
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.08); }
    input, select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      padding: 0.45rem 0.6rem;
    }
    input:focus-visible,
    select:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--credential);
      outline-offset: 1px;
    }
    .callout {
      background: #2a1414;
      border: 1px solid #5a2a2a;
      color: var(--fail);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1rem;
      font-size: 13px;
    }
    .transmission {
      background: #0a0d16;
      border: 1px solid var(--credential);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }
    .transmission .label {
      color: var(--credential);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .transmission code {
      font: 400 13px var(--font-mono);
      color: var(--text);
      word-break: break-all;
    }
    .empty-state {
      padding: 3rem 1rem;
      text-align: center;
      color: var(--text-dim);
    }
    .nav-tabs { display: flex; gap: 0.3rem; }
    .nav-tabs a {
      color: var(--text-dim);
      text-decoration: none;
      font: 500 12px var(--font-body);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      border: 1px solid transparent;
    }
    .nav-tabs a:hover { color: var(--text); }
    .nav-tabs a.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }
    .logout-link {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font: 500 12px var(--font-body);
      cursor: pointer;
      padding: 0.3rem 0.65rem;
    }
    .logout-link:hover { color: var(--text); }

    /* ---- history ---- */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .filter-bar .grow { flex: 1; }
    .call-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .call-row {
      display: grid;
      grid-template-columns: 4rem 5rem minmax(0, 1fr) 7rem 4.5rem 10rem;
      align-items: center;
      gap: 0.7rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
    }
    .call-row:hover { border-color: var(--credential); }
    .call-row.error { border-left-color: var(--fail); }
    .call-row.ok { border-left-color: var(--ok); }
    /* The arguments column is the one that can hold an arbitrarily long URL;
       min-width:0 lets it actually shrink inside the grid track so the
       fixed-width metric columns keep their alignment across rows. */
    .call-row .args {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font: 400 12px var(--font-mono);
      color: var(--text);
      text-decoration: none;
    }
    .call-row .args:hover { color: var(--credential); }
    .call-row .metric {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      font: 400 11px var(--font-mono);
      color: var(--text-dim);
      white-space: nowrap;
      text-decoration: none;
    }
    a.metric:hover { color: var(--credential); }
    .call-row time {
      font: 400 11px var(--font-mono);
      color: var(--text-dim);
      white-space: nowrap;
    }
    /* Below this width the metric columns can't hold their content without
       squeezing the arguments — which is the column people actually read —
       so they drop out and the detail view carries them instead. */
    @media (max-width: 760px) {
      .call-row {
        grid-template-columns: 4rem 5rem minmax(0, 1fr);
      }
      .call-row .metric, .call-row time { display: none; }
    }
    .tool-badge {
      font: 500 11px var(--font-mono);
      color: var(--credential);
      background: #182033;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.1rem 0.5rem;
      text-align: center;
    }
    .status-badge {
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .status-badge.ok { background: #17281d; color: var(--ok); }
    .status-badge.error { background: #2a1414; color: var(--fail); }
    .load-more { display: block; margin: 1rem auto 0; }

    /* ---- call detail ---- */
    .back-link {
      display: inline-block;
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 1rem;
    }
    .back-link:hover { color: var(--text); }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .panel h3 {
      font: 600 13px var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin: 0 0 0.7rem;
    }
    .kv {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.35rem 1rem;
      margin: 0;
    }
    .kv dt {
      color: var(--text-dim);
      font-size: 12px;
    }
    .kv dd {
      margin: 0;
      font: 400 12px var(--font-mono);
      word-break: break-all;
    }
    .payload {
      background: #0a0d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      margin: 0;
      max-height: 28rem;
      overflow: auto;
      font: 400 12px/1.55 var(--font-mono);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .truncation-note {
      color: var(--signal);
      font-size: 12px;
      margin-top: 0.5rem;
    }
    .error-text { color: var(--fail); }

    /* ---- agents ---- */
    .dispatch-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .dispatch-bar input { flex: 1; }
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.9rem;
    }
    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
    }
    .agent-card .beacon-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    .beacon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--revoked);
      flex-shrink: 0;
    }
    .beacon.active {
      background: var(--signal);
      box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.55);
      animation: pulse 2.2s infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .beacon.active { animation: none; }
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.45); }
      70%  { box-shadow: 0 0 0 6px rgba(255, 180, 84, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0); }
    }
    .agent-card .name { font: 600 15px var(--font-display); color: #fff; }
    .agent-card .status-label {
      font-size: 11px;
      color: var(--revoked);
      margin-left: 0.1rem;
    }
    .agent-card .status-label.active { color: var(--signal); }
    .agent-card .agent-id {
      display: block;
      font: 400 11px var(--font-mono);
      color: var(--text-dim);
      margin-bottom: 0.7rem;
      word-break: break-all;
    }
    .agent-card .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .agent-card .actions button { font-size: 12px; padding: 0.35rem 0.6rem; }
    .token-list {
      list-style: none;
      margin: 0.7rem 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .token-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font: 400 11px var(--font-mono);
      color: var(--text-dim);
    }
    .token-list li .revoked { color: var(--revoked); }
    .token-list li button { font-size: 11px; padding: 0.2rem 0.45rem; }
    .login-gate {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      height: 60vh;
      color: var(--text-dim);
    }
    .login-gate a { color: var(--credential); }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Vendored at build time (see Makefile's vendor-frontend-js target) and
       served from our own origin — no runtime dependency on a third-party
       CDN, and no CDN-supplied code executing in the same origin as
       authenticated sessions. -->
  <script src="/js/vendor/react.production.min.js"></script>
  <script src="/js/vendor/react-dom.production.min.js"></script>
  <script src="/js/app.bundle.js"></script>
</body>
</html>
